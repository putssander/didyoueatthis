[project]
name = "didyoueatthis"
version = "0.1.0"
description = "Evidence-graded tests for whether a document or dataset is memorised by (and therefore plausibly trained into) a large language model"
requires-python = ">=3.11,<3.13"
dependencies = [
  "anthropic>=1.0",
  "openai>=1.50",
  "google-genai>=1.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
  "tabulate>=0.9",
  "pypdf>=6.18.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
didyoueatthis = "didyoueatthis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/didyoueatthis"]

[tool.hatch.build.targets.wheel.force-include]
"src/didyoueatthis/controls" = "didyoueatthis/controls"

[tool.pytest.ini_options]
testpaths = ["tests"]
